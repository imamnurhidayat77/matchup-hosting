name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-web:
    name: Admin web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  api-server:
    name: API Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api-server/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

